version: "3.8"

services:
  vote:
    image: docker-vote:latest
    ports:
      - "5000:80"
    networks:
      - voting-overlay
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  result:
    image: docker-result:latest
    ports:
      - "5001:4000"
    networks:
      - voting-overlay
    environment:
      DATABASE_URL: "postgres://postgres:super_secret_swarm_password_2026@db/postgres"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  worker:
    image: docker-worker:latest
    networks:
      - voting-overlay
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  redis:
    image: redis:alpine
    networks:
      - voting-overlay
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - voting-overlay
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  voting-overlay:
    driver: overlay

volumes:
  db-data:

secrets:
  db_password:
    external: true